name: pages

on:
  push:
    branches: [main]
  pull_request:

# A reusable workflow runs with the CALLER's token permissions, so these must be
# granted here — the callee cannot add them.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  pages:
    uses: kuboon/workflows/.github/workflows/github-page-with-preview.yaml@main
    with:
      # The site is now just the "移転しました" page in site/. `mkdir -p` keeps the build working
      # for a checkout that has no site/ yet.
      build-command: mkdir -p site
      dist-dir: site
