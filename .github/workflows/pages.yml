name: pages

on:
  push:
    branches: [main]
  pull_request:

# A reusable workflow runs with the CALLER's token permissions, so these must be
# granted here — the callee cannot add them.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  pages:
    uses: kuboon/workflows/.github/workflows/github-page-with-preview.yaml@main
    with:
      # The site is now just the "移転しました" page in site/. The workflow also builds `main` with
      # this command for a PR preview, and a `main` from before the move has no site/: build the old
      # site there instead, so the live site stays up until this lands.
      build-command: "[ -d site ] || (mise run build && mv web/dist site)"
      dist-dir: site
